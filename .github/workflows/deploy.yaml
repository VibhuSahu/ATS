name: Deploy ATS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/ATS
            git pull --ff-only origin main
            docker compose up -d --build --remove-orphans

            echo "Deploying landing page..."

            mkdir -p /var/www/ats-landingpage

            find /var/www/ats-landingpage \
              -mindepth 1 -maxdepth 1 \
              -exec rm -rf -- {} +

            cp -a /opt/ATS/ats-landingpage/. \
              /var/www/ats-landingpage/

            echo "Landing page deployment completed!"

            echo "Checking landing page..."
            test -f /var/www/ats-landingpage/index.html

            echo "ATS deployment completed successfully!"
